# External keep-alive: Render's free plan sleeps a web service after 15 min
# without inbound traffic. This pings the public health endpoint every 10 min
# (independent of the bot, so it also wakes a sleeping instance).
# Scheduled workflows only run from the default branch (main).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://crypto-scalper.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 60 "$URL/healthz" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then head -c 400 /tmp/h.json; echo; exit 0; fi
            sleep 20   # a cold start from sleep can take ~1 min
          done
          echo "::warning::bot health check failed (last HTTP $code)"
