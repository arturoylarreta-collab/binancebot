[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-scalper"
version = "0.9.0"
description = "Modular, quantitative, async crypto scalping system: real-time market data, signals, ML filter, risk engine, idempotent execution (paper simulator or Binance USD-M Futures testnet), backtesting, and an embedded live dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
crypto-scalper = "crypto_scalper.main:main"

[tool.setuptools.packages.find]
include = ["crypto_scalper*"]

[tool.setuptools.package-data]
"crypto_scalper.dashboard" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: longer-running end-to-end ML fits (deselect with -m 'not slow')",
]