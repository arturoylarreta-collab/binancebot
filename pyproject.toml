[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-scalper"
version = "0.1.0"
description = "Modular, quantitative, async crypto scalping research system (FASE 1/2: architecture + market data pipeline)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["crypto_scalper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]